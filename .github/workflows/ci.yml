name: CI

# One check, named `gate`. It succeeds only if every sub-job SUCCEEDED (a skipped or cancelled job fails it), so nothing
# can pass by being skipped. The GitHub ruleset (docs/process/ruleset-gate.json) makes it REQUIRED for pull requests
# into main, with no bypass. Work happens directly on develop, where pushes run a light pass of the same jobs for
# visibility (not a merge requirement).
#
#   hygiene  Git hygiene of the commits being merged (the same code as the local hooks), counted from the point the
#            workflow was adopted (tests/gate-baseline.json); earlier history cannot be rewritten and is not judged
#   records  backlog validity, every status change since the base, walkthroughs of finished items
#   tests    the strict test rules; develop gets only the cheap mapped-and-covered rules, while main (phase
#            completion), the nightly run and manual runs get the full rules and every test group
#   audit    the repository half of the enforcement audit
#
# No secrets are used here, so the gate works for every pull request.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'   # full run every night
  workflow_dispatch:      # full run on demand (release checks)

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Git hygiene over the commits being merged
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            BASE="$(node scripts/work/range-base.mjs "origin/${{ github.base_ref }}")"
            node scripts/hooks/hygiene.mjs "$BASE" "${{ github.event.pull_request.head.sha }}"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            BASE="$(node scripts/work/range-base.mjs '${{ github.event.before }}')"
            node scripts/hooks/hygiene.mjs "$BASE" '${{ github.sha }}'
          else
            echo "No commit range to judge for a $EVENT run."
          fi

  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Backlog, status changes and walkthroughs
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            node scripts/work/cli.mjs check --base "origin/${{ github.base_ref }}"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            node scripts/work/cli.mjs check --base '${{ github.event.before }}'
          else
            node scripts/work/cli.mjs check
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install (frozen lockfiles)
        run: pnpm install --frozen-lockfile

      - name: Strict test rules
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            TARGET='${{ github.base_ref }}'
            BASE="$(node scripts/work/range-base.mjs "origin/$TARGET")"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            TARGET='${{ github.ref_name }}'
            BASE="$(node scripts/work/range-base.mjs '${{ github.event.before }}')"
          else
            echo "Full run: the strict file rules apply to a range of changes, so there is nothing to check here."
            exit 0
          fi
          if [ "$TARGET" = 'main' ]; then
            # Phase completion: every changed file mapped, covered, and tested.
            node scripts/test-groups.mjs check --base "$BASE"
          else
            # Day-to-day integration into develop: only the cheap rules (mapped and covered by an active group).
            node scripts/test-groups.mjs check --commit-stage --base "$BASE"
          fi

      - name: Select groups
        id: select
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'schedule' ] || [ "$EVENT" = 'workflow_dispatch' ]; then
            ARGS=all
          elif [ "$EVENT" = 'pull_request' ] && [ '${{ github.base_ref }}' = 'main' ]; then
            ARGS=all
          elif [ "$EVENT" = 'push' ] && [ '${{ github.ref_name }}' = 'main' ]; then
            ARGS=all
          else
            ARGS=none
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          if [ "$ARGS" = 'none' ]; then
            echo "No test groups run for this change: the full suite runs for main, nightly and manual runs."
            echo "needs_db=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/test-groups.mjs $ARGS --dry-run | tee plan.txt
          # The runner reports whether any selected group needs the local Supabase stack.
          if grep -qx "needs local database: true" plan.txt; then
            echo "needs_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_db=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start local Supabase (only when a selected group needs it)
        if: steps.select.outputs.needs_db == 'true'
        run: pnpm db:start

      - name: Run every test group (main, nightly and manual runs)
        if: steps.select.outputs.args != 'none'
        run: node scripts/test-groups.mjs ${{ steps.select.outputs.args }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enforcement audit (repository files)
        run: node scripts/work/audit.mjs --repo

  gate:
    needs: [hygiene, records, tests, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check must have succeeded
        run: |
          set -euo pipefail
          failed=0
          for pair in "hygiene=${{ needs.hygiene.result }}" "records=${{ needs.records.result }}" "tests=${{ needs.tests.result }}" "audit=${{ needs.audit.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "The gate failed: every check must succeed, and a skipped or cancelled check counts as a failure."
            exit 1
          fi
          echo "The gate passed."
