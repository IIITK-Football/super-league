name: CI

# One required check, named `gate`, judges every pull request. It succeeds only if every sub-job SUCCEEDED (a skipped
# or cancelled job fails it), so nothing can pass by being skipped. The GitHub ruleset (docs/process/ruleset-gate.json)
# makes `gate` required for develop and main, with no bypass.
#
#   hygiene  Git hygiene of the commits being merged (the same code as the local hooks)
#   records  backlog validity, every status change since the base, walkthroughs of finished items
#   tests    the strict test rules, then the affected test groups (all groups for main, nightly and manual runs)
#   audit    the repository half of the enforcement audit
#
# No secrets are used here, so the gate works for every pull request.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'   # full run every night
  workflow_dispatch:      # full run on demand (release checks)

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Git hygiene over the commits being merged
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            node scripts/hooks/hygiene.mjs "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            node scripts/hooks/hygiene.mjs '${{ github.event.before }}' '${{ github.sha }}'
          else
            echo "No commit range to judge for a $EVENT run."
          fi

  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Backlog, status changes and walkthroughs
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            node scripts/work/cli.mjs check --base "origin/${{ github.base_ref }}"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            node scripts/work/cli.mjs check --base '${{ github.event.before }}'
          else
            node scripts/work/cli.mjs check
          fi

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install (frozen lockfiles)
        run: pnpm install --frozen-lockfile

      - name: Strict test rules (every changed file mapped, covered and tested)
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'pull_request' ]; then
            node scripts/test-groups.mjs check --base "origin/${{ github.base_ref }}"
          elif [ "$EVENT" = 'push' ] && [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            node scripts/test-groups.mjs check --base '${{ github.event.before }}'
          else
            echo "Full run: the strict file rules apply to changes, so there is no range to check."
          fi

      - name: Select groups
        id: select
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = 'schedule' ] || [ "$EVENT" = 'workflow_dispatch' ]; then
            ARGS=all
          elif [ "$EVENT" = 'pull_request' ] && [ '${{ github.base_ref }}' = 'main' ]; then
            ARGS=all
          elif [ "$EVENT" = 'pull_request' ]; then
            ARGS="affected --base origin/${{ github.base_ref }}"
          elif [ -n '${{ github.event.before }}' ] && [ '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]; then
            ARGS="affected --base ${{ github.event.before }}"
          else
            ARGS=all
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          node scripts/test-groups.mjs $ARGS --dry-run | tee plan.txt
          # The runner reports whether any selected group needs the local Supabase stack.
          if grep -qx "needs local database: true" plan.txt; then
            echo "needs_db=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_db=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start local Supabase (only when a selected group needs it)
        if: steps.select.outputs.needs_db == 'true'
        run: pnpm db:start

      - name: Run selected groups
        run: node scripts/test-groups.mjs ${{ steps.select.outputs.args }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enforcement audit (repository files)
        run: node scripts/work/audit.mjs --repo

  gate:
    needs: [hygiene, records, tests, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every check must have succeeded
        run: |
          set -euo pipefail
          failed=0
          for pair in "hygiene=${{ needs.hygiene.result }}" "records=${{ needs.records.result }}" "tests=${{ needs.tests.result }}" "audit=${{ needs.audit.result }}"; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "The gate failed: every check must succeed, and a skipped or cancelled check counts as a failure."
            exit 1
          fi
          echo "The gate passed."
