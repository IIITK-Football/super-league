name: Update OG Screenshots to R2

# The job screenshots the PRODUCTION site and syncs the images to R2, so a push to develop changes nothing it would
# capture. It refreshes when main is pushed (a production deploy), nightly, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Two runs must never upload at once (the last writer would win at random); a run that is already uploading is not cancelled.
concurrency:
  group: og-screenshots
  cancel-in-progress: false

jobs:
  snapshot-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 📦 Install Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright
        working-directory: ./frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: 📸 Take Screenshots
        working-directory: ./frontend
        run: node scripts/take-screenshots.js

      - name: ✅ Check every screenshot was captured
        working-directory: ./frontend
        run: |
          set -euo pipefail
          # The script logs a failed page and carries on, so verify the whole set before anything is uploaded.
          for name in home fantasy wc matches standings statistics legends rules; do
            [ -s "screenshots/$name.png" ] || { echo "Missing or empty screenshot: $name.png"; exit 1; }
          done
          echo "All 8 screenshots captured."

      - name: ☁️ Upload to R2
        working-directory: ./frontend
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync ./screenshots s3://${{ secrets.R2_BUCKET_NAME }} \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
