name: Database deploy

# develop -> staging project, GitHub environment "Database Preview" (migrations, then the synthetic seed
#            and its verification through scripts/preview-seed.sh; rerunning refreshes the fixtures)
# main    -> production project, GitHub environment "Database Production" (migrations only; never
#            seeded; waits for a required reviewer)
#
# Backup gate (docs/backups.md): on main, the production-backup job (environment "Database Backup", no reviewer) first
# dumps production, proves the dump restores, encrypts it, uploads it under automated-prod/pre-migration/ and reads it
# back. The production job needs it, so if the backup or its verification fails, the production job is skipped: no
# approval is requested and no migration starts. After approval, production's first database step confirms that same
# object again (checksum, manifest, at most 6 hours old) and prints "Production migration permitted: yes" before it
# links to the project. There is no input or variable that skips the backup.
#
# These two environments are dedicated to this workflow. The environments named "Preview" and
# "Production" belong to the Vercel integration and are deliberately not used here.
#
# Each environment has its own project reference and secrets, stored as GitHub Environment
# secrets/variables named identically (SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD secrets;
# SUPABASE_PROJECT_REF variable). PRODUCTION_PROJECT_REF is a repository variable (not a secret)
# that lets the staging job refuse to run against production. See docs/release.md.

on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/seed.sql'
      - 'scripts/preview-seed.sh'
      - 'scripts/sql/verify-preview.sql'
      - 'scripts/sql/verify-captain-rpc.sql'
      - '.github/workflows/db-deploy.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the migrations that would be applied'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install (frozen lockfiles)
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Prove the migrations and seed on an empty local database
        run: node scripts/test-groups.mjs run database

      - name: Prove a seed rerun adds no duplicates and the Preview checks pass (local database only)
        run: |
          set -euo pipefail
          URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          counts() {
            psql "$URL" -X -Atc "SELECT (SELECT count(*) FROM public.matches) || ',' || (SELECT count(*) FROM public.teams) || ',' || (SELECT count(*) FROM public.players) || ',' || (SELECT count(*) FROM public.goals) || ',' || (SELECT count(*) FROM public.predictions) || ',' || (SELECT count(*) FROM public.wc_predictions) || ',' || (SELECT count(*) FROM auth.users)"
          }
          before="$(counts)"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -f backend/supabase/seed.sql
          after="$(counts)"
          echo "before the rerun: $before"
          echo "after the rerun:  $after"
          [ "$before" = "$after" ] || { echo "A seed rerun changed the row counts"; exit 1; }
          psql "$URL" -X -q --csv -v ON_ERROR_STOP=1 -f scripts/sql/verify-preview.sql > verify-preview.csv
          cat verify-preview.csv
          [ "$(wc -l < verify-preview.csv)" -gt 10 ] || { echo "The Preview checks returned too few rows"; exit 1; }
          if grep -q ',f$' verify-preview.csv; then echo "A Preview check failed"; exit 1; fi
          { echo '### Seed rerun and Preview checks (local, in CI)'; echo "Row counts before and after a rerun are identical: \`$after\`"; echo 'Preview checks: all passed'; } >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: verify
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Database Preview
    concurrency:
      group: db-deploy-staging
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install (frozen lockfiles)
        run: pnpm install --frozen-lockfile

      - name: Refuse to run against the production project
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_PROJECT_REF" ] || { echo "The staging environment has no SUPABASE_PROJECT_REF variable"; exit 1; }
          [ -n "$PRODUCTION_PROJECT_REF" ] || { echo "The PRODUCTION_PROJECT_REF repository variable is not set; refusing to continue"; exit 1; }
          [ "$SUPABASE_PROJECT_REF" != "$PRODUCTION_PROJECT_REF" ] || { echo "The staging reference equals the production reference; refusing to continue"; exit 1; }

      - name: Link to the staging project
        working-directory: backend
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify the linked project
        working-directory: backend
        run: |
          set -euo pipefail
          linked="$(cat supabase/.temp/project-ref)"
          [ "$linked" = "$SUPABASE_PROJECT_REF" ] || { echo "The linked project does not match this environment's reference"; exit 1; }
          [ "$linked" != "$PRODUCTION_PROJECT_REF" ] || { echo "Linked to production from the staging job; refusing to continue"; exit 1; }

      - name: Preview pending migrations
        working-directory: backend
        run: |
          set -euo pipefail
          pnpm exec supabase db push --dry-run 2>&1 | tee dry-run.txt
          { echo '### Staging: pending migrations'; echo '```'; cat dry-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: backend
        run: pnpm exec supabase db push

      # The synthetic seed is applied by a guarded script, not by a flag on the migration push: it re-checks
      # the project reference, runs the existing seed.sql once and reports. A rerun refreshes fixtures
      # without duplicating them. This step exists only in this job, so production is never seeded.
      - name: Apply the synthetic seed
        if: github.event_name == 'push' || inputs.dry_run == false
        run: bash scripts/preview-seed.sh seed

      - name: Verify the seeded project
        if: github.event_name == 'push' || inputs.dry_run == false
        run: bash scripts/preview-seed.sh verify

      - name: Probe the public API (anonymous callers must be refused)
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          PREVIEW_PUBLISHABLE_KEY: ${{ vars.PREVIEW_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_PUBLISHABLE_KEY" ]; then
            echo "Public API probe: skipped (PREVIEW_PUBLISHABLE_KEY is not set in the Database Preview environment)"
            { echo '### Preview: public API probe'; echo 'Skipped: PREVIEW_PUBLISHABLE_KEY is not set in the Database Preview environment.'; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/verify-rpc-closed.mjs "https://${SUPABASE_PROJECT_REF}.supabase.co" "$PREVIEW_PUBLISHABLE_KEY" | tee probe.txt
          { echo '### Preview: public API probe'; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  production-backup:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Database Backup
    concurrency:
      group: db-backup-production
      cancel-in-progress: false
    outputs:
      key: ${{ steps.backup.outputs.key }}
      sha256: ${{ steps.backup.outputs.sha256 }}
      created-at: ${{ steps.backup.outputs.created-at }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (frozen lockfile; the Supabase CLI runs the restore test)
        run: pnpm install --frozen-lockfile

      - name: Back up production before any migration
        id: backup
        uses: ./.github/actions/database-backup
        with:
          target: production
          reason: pre-migration
          note: before production migrations at ${{ github.sha }}
          db-url: ${{ secrets.PRODUCTION_BACKUP_DB_URL }}
          expected-ref: ${{ vars.PRODUCTION_PROJECT_REF }}
          production-ref: ${{ vars.PRODUCTION_PROJECT_REF }}
          age-recipient: ${{ vars.BACKUP_AGE_RECIPIENT }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          r2-endpoint: ${{ secrets.R2_ENDPOINT }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

  production:
    needs: [verify, production-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Database Production
    concurrency:
      group: db-deploy-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PRODUCTION_PROJECT_REF: ${{ vars.PRODUCTION_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Install (frozen lockfiles)
        run: pnpm install --frozen-lockfile

      - name: Check the environment points at the production project
        run: |
          set -euo pipefail
          [ -n "$PRODUCTION_PROJECT_REF" ] || { echo "The PRODUCTION_PROJECT_REF repository variable is not set; refusing to continue"; exit 1; }
          [ "$SUPABASE_PROJECT_REF" = "$PRODUCTION_PROJECT_REF" ] || { echo "The production environment's reference does not match PRODUCTION_PROJECT_REF; refusing to continue"; exit 1; }

      - name: Confirm the pre-migration backup
        env:
          BACKUP_KEY: ${{ needs.production-backup.outputs.key }}
          BACKUP_SHA256: ${{ needs.production-backup.outputs.sha256 }}
          MAX_AGE_HOURS: '6'
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash scripts/backup/confirm-backup.sh

      - name: Link to the production project
        working-directory: backend
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify the linked project
        working-directory: backend
        run: |
          set -euo pipefail
          linked="$(cat supabase/.temp/project-ref)"
          [ "$linked" = "$PRODUCTION_PROJECT_REF" ] || { echo "The linked project is not the production project; refusing to continue"; exit 1; }

      - name: Preview pending migrations
        working-directory: backend
        run: |
          set -euo pipefail
          pnpm exec supabase db push --dry-run 2>&1 | tee dry-run.txt
          { echo '### Production: pending migrations'; echo '```'; cat dry-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to replay the baseline migration
        working-directory: backend
        run: |
          set -euo pipefail
          # The production database was built by hand and had no migration history, so the baseline
          # must be marked as applied, never run. If it is still listed as pending, the history was
          # not repaired yet: stop before anything is applied.
          if grep -qE '20261106000000|20261106180125' dry-run.txt; then
            echo "The baseline migration is listed as pending for production."
            echo "Production has no migration history recording it. Mark it as applied (never run it) as described in docs/release.md, then run this workflow again."
            exit 1
          fi

      - name: Apply migrations (no seed, no out-of-order migrations)
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: backend
        run: pnpm exec supabase db push
